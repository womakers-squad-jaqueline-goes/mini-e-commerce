<h2>Meu carrinho</h2>

<section *ngIf="itens.length > 0; else carrinhoVazio">
  <article *ngFor="let item of itens">
    <img [src]="item.image" [alt]="item.title" width="100">

    <div>
      <h3>{{ item.title }}</h3>
      <p>{{ item.price | currency:'BRL':'symbol':'1.2-2' }}</p>
    </div>
  </article>
</section>

<ng-template #carrinhoVazio>
  <p>Seu carrinho está vazio.</p>
</ng-template>
